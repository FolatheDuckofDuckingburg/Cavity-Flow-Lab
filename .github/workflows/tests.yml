name: Tests and numerical diagnostics

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run software invariant tests
        run: pytest -q
      - name: Run short diagnostic benchmark
        run: |
          set +e
          python scripts/benchmark.py --grids 8 --steps 2 --repeats 1 --output results/ci-benchmark.json
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::Divergence diagnostic failed; inspect the JSON artifact."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-benchmark-report
          path: results/ci-benchmark.json
          if-no-files-found: ignore
