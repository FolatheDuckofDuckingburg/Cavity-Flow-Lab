name: Tests and diagnostics

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Run short benchmark smoke test
        run: |
          python scripts/benchmark.py --grids 8 --steps 2 --repeats 1 --output results/ci-benchmark.json || status=$?
          if [ "${status:-0}" -gt 2 ]; then exit "$status"; fi
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-benchmark-report
          path: results/ci-benchmark.json
          if-no-files-found: ignore
